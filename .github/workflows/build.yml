name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: ffmpeg 설치
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          # choco 가 PATH 에 두는 ffmpeg.exe 는 작은 '심'이라 번들하면 사용자 PC 에서 동작하지 않는다(v0.5.1 버그).
          # 진짜 실행 파일을 bin\ 에 복사해 spec 이 그걸 쓰게 한다.
          New-Item -ItemType Directory -Force bin | Out-Null
          foreach ($n in "ffmpeg.exe", "ffprobe.exe") {
            $real = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter $n | Where-Object { $_.Length -gt 2MB } | Select-Object -First 1
            if (-not $real) { throw "real $n not found under choco lib" }
            Copy-Item $real.FullName bin\$n -Force
            Write-Host "$n <- $($real.FullName) ($([math]::Round($real.Length/1MB)) MB)"
          }
      - name: libmpv 받기 (shinchiro 빌드)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir bin
          $archive = Get-ChildItem bin\*.7z | Select-Object -First 1
          7z x $archive.FullName -obin -y | Out-Null
          Get-ChildItem bin | Select-Object Name
          if (-not (Test-Path bin\libmpv-2.dll)) { throw "libmpv-2.dll not found" }
      - name: 의존성 설치
        run: uv sync
      - name: PO 토큰 실행 파일 받기 (bgutil-pot, SHA-256 고정)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.1 -R jim60105/bgutil-ytdlp-pot-provider-rs -p "bgutil-pot-windows-x86_64.exe" --dir bin
          $h = (Get-FileHash bin\bgutil-pot-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "25d6b05c79176aa792454c3d1727922ca47e56cf11cb1e866615d751819b14a0") { throw "bgutil-pot SHA-256 mismatch: $h" }
          Move-Item bin\bgutil-pot-windows-x86_64.exe bin\bgutil-pot.exe -Force
      - name: 단위 테스트
        run: uv run pytest -q tests/test_units.py
      - name: 오픈소스 라이선스 고지 만들기
        run: uv run python packaging/make_licenses.py
      - name: 빌드
        run: uv run pyinstaller --noconfirm --clean packaging/classplayer.spec
      - name: 번들 ffmpeg 확인 (심이 아니고 실제로 실행되는지)
        shell: pwsh
        run: |
          foreach ($n in "ffmpeg.exe", "ffprobe.exe") {
            $f = Get-Item dist\ClassPlayer\_internal\$n
            Write-Host "$n $([math]::Round($f.Length/1MB)) MB"
            if ($f.Length -lt 2MB) { throw "$n is too small (choco shim?)" }
          }
          # PATH 에서 choco 를 빼고 번들 파일만으로 실행되는지
          $env:PATH = "C:\Windows\System32"
          # 출력을 다 받은 뒤 첫 줄만 보여 준다 (Select-Object -First 로 파이프를 끊으면 종료 코드가 0 이 아니게 됨)
          $out = & dist\ClassPlayer\_internal\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "bundled ffmpeg failed" }
          Write-Host ($out | Select-Object -First 1)
      - name: 업데이트 바꿔 끼우기 시험 (실제 exe, 옛 앱 실행 중·한글/띄어쓰기 경로)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\updtest"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          $instParent = "$root\설치 폴더"; $newParent = "$root\new"
          New-Item -ItemType Directory -Force $instParent, $newParent | Out-Null
          Copy-Item dist\ClassPlayer $instParent -Recurse
          Copy-Item dist\ClassPlayer $newParent -Recurse
          $inst = "$instParent\ClassPlayer"; $new = "$newParent\ClassPlayer"
          "old" | Set-Content "$inst\MARK.txt"
          "new" | Set-Content "$new\MARK.txt"
          $env:CLASSPLAYER_TEST_SETTINGS = "1"
          $old = Start-Process "$inst\ClassPlayer.exe" -PassThru      # 옛 앱이 떠 있어 파일이 잠긴 상태
          Start-Sleep 6
          $env:CLASSPLAYER_UPDATE_WAIT = "5"
          $env:CLASSPLAYER_UPDATE_LOG = "$root\update.log"
          $h = Start-Process "$new\ClassPlayer.exe" -ArgumentList "--apply-update", $old.Id, "`"$inst`"" -PassThru
          if (-not $h.WaitForExit(180000)) { throw "apply-update did not finish" }
          Get-Content "$root\update.log" -Encoding utf8
          if ((Get-Content "$inst\MARK.txt") -ne "new") { throw "files were not replaced" }
          if (-not (Select-String -Path "$root\update.log" -Pattern "새 앱 실행" -Encoding utf8)) { throw "app was not relaunched" }
          Start-Sleep 6
          $re = Get-Process ClassPlayer -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$inst*" }
          if (-not $re) { throw "relaunched app is not running" }
          $re | ForEach-Object { "relaunched: PID $($_.Id) $($_.Path)"; Stop-Process $_ -Force }
          Get-Process ClassPlayer -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: 자가 점검 (실패해도 계속)
        continue-on-error: true
        shell: pwsh
        run: |
          ffmpeg -y -v error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=8" -c:v libx264 -pix_fmt yuv420p selftest.mp4
          $env:CLASSPLAYER_SELFTEST = "$PWD\selftest.mp4"
          & dist\ClassPlayer\ClassPlayer.exe | Tee-Object -Variable out
          Write-Host $out
      - name: 탐색기 '연결 프로그램' 처럼 열기 (파일 인자, 한글·띄어쓰기 경로, 다른 작업 폴더)
        continue-on-error: true
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "한글 폴더"
          New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d "수업 영상.mp4"
          Copy-Item selftest.mp4 $f
          $exe = (Resolve-Path dist\ClassPlayer\ClassPlayer.exe).Path
          $env:CLASSPLAYER_SELFTEST = "argv"
          Push-Location C:\Windows\System32
          & $exe $f | Tee-Object -Variable out      # 파이프로 받아야 창 프로그램이 끝날 때까지 기다린다
          Pop-Location
          Write-Host $out
          $line = ($out | Select-String 'SELFTEST (.*)').Matches[0].Groups[1].Value
          $j = $line | ConvertFrom-Json
          "time-pos=$($j.'time-pos') side_collapsed=$($j.side_collapsed) current=$($j.current) cloud=$($j.cloud | ConvertTo-Json -Compress)"
          if ($j.'time-pos' -lt 2) { throw "파일 인자로 연 영상이 재생되지 않음" }
          if (-not $j.side_collapsed) { throw "파일로 열었는데 옆 창이 접히지 않음" }
          if (-not $j.current.EndsWith("수업 영상.mp4")) { throw "다른 파일이 열림: $($j.current)" }
      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path dist\ClassPlayer -DestinationPath ClassPlayer-windows-x64.zip
      - name: 설치 프로그램 (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = (Select-String -Path src\classplayer\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $extra = @()
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl")) { $extra += "/DNOKOREAN" }
          & $iscc "/DAppVersion=$ver" @extra packaging\classplayer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPlayer-windows-x64
          path: |
            ClassPlayer-windows-x64.zip
            dist/ClassPlayer-Setup-windows-x64.exe
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClassPlayer-windows-x64.zip
            dist/ClassPlayer-Setup-windows-x64.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: mpv, ffmpeg, deno 설치
        run: brew install mpv ffmpeg deno
      - name: 의존성 설치
        run: uv sync
      - name: 단위 테스트
        run: uv run pytest -q tests/test_units.py
      - name: 빌드
        env:
          SKIP_SELFTEST: "1"
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPlayer-mac-arm64
          path: |
            dist/ClassPlayer-mac-arm64.zip
            dist/ClassPlayer-mac-arm64.dmg
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClassPlayer-mac-arm64.zip
            dist/ClassPlayer-mac-arm64.dmg

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: ffmpeg 설치
        run: choco install ffmpeg --no-progress -y
      - name: libmpv 받기 (shinchiro 빌드)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir bin
          $archive = Get-ChildItem bin\*.7z | Select-Object -First 1
          7z x $archive.FullName -obin -y | Out-Null
          Get-ChildItem bin | Select-Object Name
          if (-not (Test-Path bin\libmpv-2.dll)) { throw "libmpv-2.dll not found" }
      - name: 의존성 설치
        run: uv sync
      - name: 단위 테스트
        run: uv run pytest -q tests/test_units.py
      - name: 빌드
        run: uv run pyinstaller --noconfirm --clean packaging/classplayer.spec
      - name: 자가 점검 (실패해도 계속)
        continue-on-error: true
        shell: pwsh
        run: |
          ffmpeg -y -v error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=8" -c:v libx264 -pix_fmt yuv420p selftest.mp4
          $env:CLASSPLAYER_SELFTEST = "$PWD\selftest.mp4"
          & dist\ClassPlayer\ClassPlayer.exe | Tee-Object -Variable out
          Write-Host $out
      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path dist\ClassPlayer -DestinationPath ClassPlayer-windows-x64.zip
      - name: 설치 프로그램 (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = (Select-String -Path src\classplayer\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $extra = @()
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl")) { $extra += "/DNOKOREAN" }
          & $iscc "/DAppVersion=$ver" @extra packaging\classplayer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPlayer-windows-x64
          path: |
            ClassPlayer-windows-x64.zip
            dist/ClassPlayer-Setup-windows-x64.exe
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClassPlayer-windows-x64.zip
            dist/ClassPlayer-Setup-windows-x64.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: mpv, ffmpeg, deno 설치
        run: brew install mpv ffmpeg deno
      - name: 의존성 설치
        run: uv sync
      - name: 단위 테스트
        run: uv run pytest -q tests/test_units.py
      - name: 빌드
        env:
          SKIP_SELFTEST: "1"
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPlayer-mac-arm64
          path: |
            dist/ClassPlayer-mac-arm64.zip
            dist/ClassPlayer-mac-arm64.dmg
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClassPlayer-mac-arm64.zip
            dist/ClassPlayer-mac-arm64.dmg
